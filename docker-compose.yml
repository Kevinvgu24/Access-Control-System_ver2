services:
  smart-door-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-door-server
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - /mnt/smart-door/database:/app/database
      - /mnt/smart-door/database/logs:/app/logs
    environment:
      - MQTT_BROKER_HOST=broker.emqx.io
      - MQTT_BROKER_PORT=1883
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-server
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - /mnt/smart-door/database/qdrant_storage:/qdrant/storage
